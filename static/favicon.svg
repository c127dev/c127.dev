<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- C>_ - the site mark. Paths, not <text>: a favicon rendered in whatever the
       OS happens to call "monospace" is not a mark you control.
       Geometry is tuned for 16px, where the glyphs merge if they get any closer:
       the underscore sits low and right of the chevron's apex so the two do not
       blur into an "L". Check any change with:
         rsvg-convert -w 16 -h 16 static/favicon.svg -o /tmp/f.png -->
  <rect width="32" height="32" rx="7" fill="#111113"/>
  <g fill="none" stroke="#fafafa" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.9 12.6 A 4.5 4.5 0 1 0 11.9 19.4"/>
    <path d="M17.6 12.0 L20.9 15.3 L17.6 18.6"/>
    <path d="M24.4 21.0 L28.0 21.0"/>
  </g>
</svg>
